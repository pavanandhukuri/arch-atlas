name: online-boutique
# GoogleCloudPlatform/microservices-demo ("Online Boutique") — the polyglot
# microservices reference Understand-Anything's README points at. Cloned at a
# pinned SHA into ./workspace/ by test/eval/clone-workspace.ts (not vendored).
workspace:
  clone:
    repo: https://github.com/GoogleCloudPlatform/microservices-demo.git
    sha: 72ba613a05f7fcee51cf1d0badff401b6ae7074d
    subdir: src
repos:
  - { name: frontend, path: frontend }
  - { name: cartservice, path: cartservice }
  - { name: productcatalogservice, path: productcatalogservice }
  - { name: currencyservice, path: currencyservice }
  - { name: paymentservice, path: paymentservice }
  - { name: shippingservice, path: shippingservice }
  - { name: emailservice, path: emailservice }
  - { name: checkoutservice, path: checkoutservice }
  - { name: recommendationservice, path: recommendationservice }
  - { name: adservice, path: adservice }
