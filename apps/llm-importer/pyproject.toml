[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-atlas-import"
version = "0.3.0"
description = "Static-analysis + LLM enrichment pipeline that generates architecture diagrams from local repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Pavan Andhukuri", email = "pavan496@gmail.com" },
]
keywords = ["architecture", "diagram", "llm", "static-analysis", "microservices"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pavanandhukuri/arch-atlas"
Repository = "https://github.com/pavanandhukuri/arch-atlas"
"Bug Tracker" = "https://github.com/pavanandhukuri/arch-atlas/issues"

dependencies = [
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.23.0",
    "anyio>=4.4.0",
    "click>=8.1.7",
    "networkx>=3.3",
    "tree-sitter>=0.23,<0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-kotlin>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-jsonschema>=4.23.0",
    "types-networkx>=3.3",
]

[project.scripts]
arch-atlas-import = "llm_importer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_importer*"]

[tool.setuptools.package-data]
llm_importer = ["extraction/rules/*.yml", "extraction/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=llm_importer --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["llm_importer"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
