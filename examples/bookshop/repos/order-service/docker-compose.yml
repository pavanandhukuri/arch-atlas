services:
  order-service:
    build: .
    ports: ['8082:8082']
    environment:
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders
      KAFKA_BROKER: kafka:9092
    depends_on: [postgres, kafka]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders

  kafka:
    image: bitnami/kafka:3.7
