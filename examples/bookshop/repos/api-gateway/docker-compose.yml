services:
  api-gateway:
    build: .
    ports: ['8080:8080']
    environment:
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/bookshop/protocol/openid-connect/certs
    depends_on: [keycloak]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    ports: ['8180:8080']
